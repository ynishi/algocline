[package]
name = "algocline-nn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "algocline neural-network bridge — thin candle wrapper exposing alc.nn to Lua"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[dependencies]
# Chess rules for the PGN ingestion path (`src/pgn.rs`): legal move
# generation is what turns a SAN token such as `Nf3` into a concrete
# move, because SAN records only the destination and leaves the origin
# to be recovered from the position. Hand-writing that means
# re-implementing castling, en passant, promotion and pin detection —
# a large surface with no cheap self-check.
#
# License is the reason this is `cozy-chess` and not `shakmaty`:
# shakmaty (and its sibling `pgn-reader`) is GPL-3.0-or-later, which
# cannot be linked into this workspace's `MIT OR Apache-2.0`
# distribution. `cozy-chess` is MIT and carries legal movegen, FEN and
# `GameStatus`. It has no SAN support, so SAN resolution lives in
# `src/pgn.rs`.
#
# This crate is only linked when the engine's `nn` feature is on, so
# the dependency stays inside that feature by construction.
cozy-chess = "0.3"
# CPU by default. The optional `nn-cuda` feature turns on candle's CUDA
# backend; on a CUDA-less dev host that feature only compiles behind an
# `nvcc` toolchain. candle-core / candle-nn are released in lockstep;
# keep their minor versions equal.
candle-core = "0.11"
candle-nn = "0.11"
# candle-transformers ships reference implementations of Llama / Qwen2
# / Phi / Gemma / Mistral / Mixtral / ... so the inference-fleet
# adapter (`arch::adapter`) can wrap them into `alc.nn` handles instead
# of re-implementing each transformer stack. Version pinned in lockstep
# with candle-core / candle-nn so the three crates share the same
# `Tensor` / `VarBuilder` types at link time.
candle-transformers = "0.11"
# Must match the engine's mlua (0.11, lua54, vendored, send) so a single mlua
# links in the `--features nn` engine build. The `send` feature requires
# UserData to be Send — candle `Tensor` is Arc-backed and Send + Sync.
mlua = { version = "0.11", features = ["lua54", "vendored", "send", "serialize"] }
# Card metadata schema (`card.rs`) — Serialize/Deserialize helpers for the
# `[metadata.nn]` block written by the engine bridge and populated by
# downstream training subtasks.
serde = { workspace = true }
serde_json = { workspace = true }
# HuggingFace tokenizer for pre-trained tokenizer artifacts
# (design §6.3 / §12 Q2 / §12 Q5).
tokenizers = "0.19"
# Jinja2 engine for the HuggingFace chat template
# (`tokenizer.rs::apply_chat_template`). A chat template is shipped by the
# model author as a Jinja2 program inside `tokenizer_config.json`, so
# rendering one means running Jinja — hand-parsing the handful of
# templates we know about would break on the next model. `minijinja` is
# the de-facto Rust engine for this (candle, mistral.rs and text-
# generation-inference all render HF chat templates with it).
# `default-features = false` drops the pieces a chat template never
# needs (debug tracing, `deserialization`, `multi_template`); `builtins`
# covers the filters templates actually use (`trim`, `tojson`,
# `default`, ...), `macros` the `{% macro %}` / `{% call %}` forms some
# templates define, `loader` the owned-source registration
# (`add_template_owned`) that lets a compiled template outlive the
# string read off disk, and `serde` the `Message` -> template-value
# conversion.
minijinja = { version = "2", default-features = false, features = ["builtins", "macros", "loader", "serde"] }
# Hub artifact fetch (`src/hub.rs`). `ureq` is a pure-sync client, which
# keeps the bridge path Runtime-free — every async client (including
# hf-hub 1.x, which wraps `reqwest`) would park a tokio runtime on a
# background thread. Same major as the one algocline-app already uses.
# See `src/hub.rs` for why hf-hub 0.3/0.4/0.5 cannot fetch from the Hub
# at all any more (relative-redirect handling).
ureq = "3"
# Parquet dataset reader (`train/data.rs::ParquetDataset`). Row API only
# (default-features off keeps the arrow-* tree out); codec features cover
# the compressions HF-hosted datasets actually ship (snappy default,
# zstd increasingly, gzip occasionally, lz4 cheap to include — a file
# using an unlisted codec fails loudly with the codec name).
parquet = { version = "59", default-features = false, features = ["snap", "zstd", "flate2-zlib-rs", "lz4"] }
# Multinomial sampling for `sampling::TemperatureSampler` / `TopKTopPSampler`.
# `StdRng` is used for reproducibility (seed-driven so save/load replays land
# on the same token stream); the workspace pin matches the version the engine
# bridge already uses.
rand = { workspace = true }
# Anchored DFA behind `sampling::constraint::RegexConstraint`. The plain
# `regex` crate cannot answer the question constrained decoding asks —
# "can this partial string still be extended into a full match?" — because
# it only reports completed matches. `regex-automata` exposes the DFA
# state machine itself, so a candidate token is walked byte by byte from
# the prefix's state and rejected the moment it lands in a dead state.
# `default-features = false` keeps the meta / hybrid / backtrack engines
# out of the build; `syntax` + `dfa-build` are exactly what compiling a
# pattern string into a dense DFA needs, and `unicode` is what makes
# `\d` / `\w` / `\b` mean what a caller writing a pattern expects.
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "dfa-build", "unicode"] }
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# tempfile — used by the ckpt / training-loop unit tests to sandbox
# safetensors output under a scoped directory.
tempfile = { workspace = true }
# tracing-subscriber — the GPU smoke examples install a stderr fmt
# subscriber so the per-step `tracing::info!` events emitted by
# `run_ft_core` show up as a loss trajectory when the caller sets
# `RUST_LOG=algocline_nn=info`. Kept in dev-deps so production builds
# of the library never pull it in.
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[features]
# Enable candle's CUDA backend for training on RunPod A40 / A100 hosts.
# CPU builds keep this off (`candle-core` without `cuda`). On dev hosts
# without an `nvcc` toolchain this feature does not compile — that is
# expected; verification runs on the CUDA-enabled tier.
#
# Both `candle-core/cuda` and `candle-nn/cuda` must be enabled together:
# candle-nn 0.11's `LayerNorm` is a `CustomOp3` whose `cuda_fwd` is
# `#[cfg(feature = "cuda")]`-gated, so a `candle-core/cuda`-only build
# still dispatches CustomOp on CPU and fails at forward time with
# `Candle("no cuda implementation for layer-norm")`. Keep this pair
# in sync when bumping candle.
nn-cuda = [
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
]

# Enable candle's Metal backend for inference on Apple silicon (M-series
# GPU). Same lockstep discipline as `nn-cuda`: candle-core / candle-nn /
# candle-transformers must be flipped together so a Metal-enabled build
# has the CustomOp kernels for LayerNorm / RmsNorm / etc. on GPU rather
# than dispatching to the CPU fallback and failing at forward time.
#
# Unlike `nn-cuda` this feature compiles on macOS without an external
# toolchain (Metal is part of the OS SDK); on non-macOS hosts the
# feature still builds but the runtime `Device::new_metal(...)` call
# errors when no Metal device is available.
nn-metal = [
    "candle-core/metal",
    "candle-nn/metal",
    "candle-transformers/metal",
]

# GPU smoke-test example: builds a full-size GPT-2 medium (355M) on
# CUDA when the `nn-cuda` feature is enabled, otherwise falls back to
# CPU (usable for compile checks but far too slow for a real run).
# Kept out of the crate's public API surface.
[[example]]
name = "nn_medium_gpu_smoke"
required-features = []

# Corpus self-check for the PGN reader (`src/pgn.rs`): replays a real
# PGN file and asserts every SAN token resolves to exactly one legal
# move. Needs no GPU and no candle work — it is the verification path
# for chess ingestion.
[[example]]
name = "pgn_san_check"
required-features = []

# End of the ingestion path: a PGN archive in, rating-banded token rows
# out, with every game read accounted for as a row or a named
# rejection.
[[example]]
name = "chess_corpus_build"
required-features = []

# Trains one model on a banded corpus and writes a checkpoint.
[[example]]
name = "chess_bake"
required-features = []

# Plays the checkpoint: given the moves so far, reports the move it
# picks and the distribution behind it.
[[example]]
name = "chess_play"
required-features = []

# Scores a checkpoint against games it never trained on: move match
# against the human move, plus how much of the raw distribution lands
# on legal moves.
[[example]]
name = "chess_eval"
required-features = []

# Measures whether the condition token changes the distribution, which
# is the thing move match cannot see.
[[example]]
name = "chess_cond"
required-features = []
