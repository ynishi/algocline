[package]
name = "algocline-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "algocline Lua execution engine — VM, session, bridge"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[dependencies]
algocline-core = { workspace = true }

# alc.nn bridge — optional, pulled only by the `nn` feature (default off) so
# the default MCP build never links candle (keeps it light).
algocline-nn = { path = "../algocline-nn", version = "0.48.1", optional = true }

# Candle re-exports named by bridge/nn_card.rs (DType / Device / VarMap
# / VarBuilder). Gated on the same `nn` feature so the default MCP
# build does not pull candle in; only enabled when the nn bridge is
# compiled.
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }

mlua = { version = "0.11", features = ["lua54", "vendored", "send", "serialize"] }
mlua-isle = { version = "0.4", features = ["tokio"] }
mlua-mathlib = "0.3"
mlua-pkg = "0.3"

serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
fuzzy-parser = "0.3"
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
anyhow = "1"
dirs = "6"
rand = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
mlua-check = "0.3"
mlua-lspec = "0.3"
proptest = "1"

[features]
test-support = []
# Opt-in neural-network bridge (`alc.nn`). Default off: the default build does
# not link candle. Enable with `--features nn`.
nn = ["dep:algocline-nn", "dep:candle-core", "dep:candle-nn"]

# GPU (CUDA) variant of the `nn` feature. Enables candle's CUDA backend
# across candle-core AND candle-nn in lockstep: candle-nn 0.11's
# LayerNorm is a `CustomOp3` whose `cuda_fwd` is
# `#[cfg(feature = "cuda")]`-gated, so a `candle-core/cuda`-only build
# still dispatches LayerNorm on CPU and fails at forward time with
# `Candle("no cuda implementation for layer-norm")`. Keep
# candle-core/cuda + candle-nn/cuda flipped together (and matched to
# algocline-nn/nn-cuda) when bumping candle.
nn-cuda = ["nn", "algocline-nn/nn-cuda", "candle-core/cuda", "candle-nn/cuda"]

# Lua-bridge GPU smoke driver — drives alc.nn.{preset, data, wrap_lora,
# trainer.run_lora_ft / run_full_ft / run_distill} through the engine
# bridge (`install_for_pkg_test`) on CUDA (device="cuda", built with
# `--features nn-cuda`) or CPU (device="cpu", built with `--features nn`).
# Gated behind `nn` so the default `cargo check --workspace` never
# compiles it.
[[example]]
name = "nn_bridge_gpu_smoke"
required-features = ["nn"]
