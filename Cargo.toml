[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.47.1"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Yutaka Nishimura"]
repository = "https://github.com/ynishi/algocline"
homepage = "https://github.com/ynishi/algocline"
documentation = "https://docs.rs/algocline"
description = "LLM amplification engine — MCP server with Lua scripting"
keywords = ["llm", "mcp", "lua", "reasoning", "ai"]
categories = ["development-tools", "science"]

[workspace.dependencies]
algocline-core = { path = "crates/algocline-core", version = "0.47.1" }
algocline-engine = { path = "crates/algocline-engine", version = "0.47.1" }
algocline-app = { path = "crates/algocline-app", version = "0.47.1" }
algocline-mcp = { path = "crates/algocline-mcp", version = "0.47.1" }

clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", features = ["preserve_order"] }
tempfile = "3"
thiserror = "2"
dotenvy = "0.15"
libc = "0.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "net", "io-util", "signal"] }
tokio-util = { version = "0.7" }
tracing = "0.1"
async-trait = "0.1"
rand = "0.10"
rmcp = { version = "1.7", features = ["server", "transport-io"] }

[package]
name = "algocline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

readme = "README.md"

[[bin]]
name = "alc"
path = "src/main.rs"

[dependencies]
algocline-app = { workspace = true }
algocline-core = { workspace = true }
algocline-engine = { workspace = true }
algocline-mcp = { workspace = true }
clap = { workspace = true }

rmcp = { workspace = true }

serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
dirs = "6"
tempfile = "3"

[features]
# Opt-in neural-network bridge (alc.nn). Off by default so the standard MCP
# build does not link candle. Enable with `--features nn` to build/install an
# `alc` binary whose alc_run exposes alc.nn.
nn = ["algocline-engine/nn"]

[dev-dependencies]
insta = { version = "1", features = ["json", "redactions"] }
libc = { workspace = true }
regex = "1"
rmcp = { version = "1.7", features = ["client", "transport-child-process"] }
serde_json = { workspace = true }
tempfile = "3"
tokio = { workspace = true }
