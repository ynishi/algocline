[package]
name = "algocline-nn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "algocline neural-network bridge — thin candle wrapper exposing alc.nn to Lua"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[dependencies]
# CPU by default. The optional `nn-cuda` feature turns on candle's CUDA
# backend; on a CUDA-less dev host that feature only compiles behind an
# `nvcc` toolchain. candle-core / candle-nn are released in lockstep;
# keep their minor versions equal.
candle-core = "0.11"
candle-nn = "0.11"
# candle-transformers ships reference implementations of Llama / Qwen2
# / Phi / Gemma / Mistral / Mixtral / ... so the inference-fleet
# adapter (`arch::adapter`) can wrap them into `alc.nn` handles instead
# of re-implementing each transformer stack. Version pinned in lockstep
# with candle-core / candle-nn so the three crates share the same
# `Tensor` / `VarBuilder` types at link time.
candle-transformers = "0.11"
# Must match the engine's mlua (0.11, lua54, vendored, send) so a single mlua
# links in the `--features nn` engine build. The `send` feature requires
# UserData to be Send — candle `Tensor` is Arc-backed and Send + Sync.
mlua = { version = "0.11", features = ["lua54", "vendored", "send", "serialize"] }
# Card metadata schema (`card.rs`) — Serialize/Deserialize helpers for the
# `[metadata.nn]` block written by the engine bridge and populated by
# downstream training subtasks.
serde = { workspace = true }
serde_json = { workspace = true }
# HuggingFace tokenizer for pre-trained tokenizer artifacts
# (design §6.3 / §12 Q2 / §12 Q5).
tokenizers = "0.19"
# Hub artifact fetch (`src/hub.rs`). `ureq` is a pure-sync client, which
# keeps the bridge path Runtime-free — every async client (including
# hf-hub 1.x, which wraps `reqwest`) would park a tokio runtime on a
# background thread. Same major as the one algocline-app already uses.
# See `src/hub.rs` for why hf-hub 0.3/0.4/0.5 cannot fetch from the Hub
# at all any more (relative-redirect handling).
ureq = "3"
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# tempfile — used by the ckpt / training-loop unit tests to sandbox
# safetensors output under a scoped directory.
tempfile = { workspace = true }
# tracing-subscriber — the GPU smoke examples install a stderr fmt
# subscriber so the per-step `tracing::info!` events emitted by
# `run_ft_core` show up as a loss trajectory when the caller sets
# `RUST_LOG=algocline_nn=info`. Kept in dev-deps so production builds
# of the library never pull it in.
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[features]
# Enable candle's CUDA backend for training on RunPod A40 / A100 hosts.
# CPU builds keep this off (`candle-core` without `cuda`). On dev hosts
# without an `nvcc` toolchain this feature does not compile — that is
# expected; verification runs on the CUDA-enabled tier.
#
# Both `candle-core/cuda` and `candle-nn/cuda` must be enabled together:
# candle-nn 0.11's `LayerNorm` is a `CustomOp3` whose `cuda_fwd` is
# `#[cfg(feature = "cuda")]`-gated, so a `candle-core/cuda`-only build
# still dispatches CustomOp on CPU and fails at forward time with
# `Candle("no cuda implementation for layer-norm")`. Keep this pair
# in sync when bumping candle.
nn-cuda = [
    "candle-core/cuda",
    "candle-nn/cuda",
    "candle-transformers/cuda",
]

# Enable candle's Metal backend for inference on Apple silicon (M-series
# GPU). Same lockstep discipline as `nn-cuda`: candle-core / candle-nn /
# candle-transformers must be flipped together so a Metal-enabled build
# has the CustomOp kernels for LayerNorm / RmsNorm / etc. on GPU rather
# than dispatching to the CPU fallback and failing at forward time.
#
# Unlike `nn-cuda` this feature compiles on macOS without an external
# toolchain (Metal is part of the OS SDK); on non-macOS hosts the
# feature still builds but the runtime `Device::new_metal(...)` call
# errors when no Metal device is available.
nn-metal = [
    "candle-core/metal",
    "candle-nn/metal",
    "candle-transformers/metal",
]

# GPU smoke-test example: builds a full-size GPT-2 medium (355M) on
# CUDA when the `nn-cuda` feature is enabled, otherwise falls back to
# CPU (usable for compile checks but far too slow for a real run).
# Kept out of the crate's public API surface.
[[example]]
name = "nn_medium_gpu_smoke"
required-features = []
